services:
  restaurant-web:
    build: .
    image: ${DOCKER_IMAGE:-danish20699/restaurant-app:latest}
    ports:
      - "${HOST_PORT:-8080}:80"
    environment:
      PGHOST: restaurant-db
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGPORT: "5432"
    depends_on:
      restaurant-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - restaurant-network

  restaurant-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - restaurant-network

volumes:
  db-data:

networks:
  restaurant-network:
    driver: bridge
